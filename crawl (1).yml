name: Auto-update university prospects

on:
  schedule:
    - cron: "0 7 * * 1"    # Every Monday — fill missing contacts
    - cron: "0 8 * * 1"    # Every Monday — find LinkedIn profiles
    - cron: "0 7 1 * *"    # Every 1st of month — discover new universities
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode"
        required: true
        default: "missing"
        type: choice
        options:
          - missing          # fill empty contacts only
          - all              # re-crawl everything
          - linkedin         # find LinkedIn profiles
          - linkedin_all     # re-check LinkedIn for everyone
          - discover         # find and add new universities
          - full             # discover + crawl + linkedin
      country:
        description: "Country filter (optional, e.g. DE)"
        required: false
        default: ""

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml

      - name: Run crawler
        run: |
          MODE="${{ github.event.inputs.mode || 'missing' }}"
          COUNTRY="${{ github.event.inputs.country }}"
          ARGS=""

          case "$MODE" in
            all)         ARGS="--all" ;;
            linkedin)    ARGS="--linkedin" ;;
            linkedin_all)ARGS="--linkedin --all" ;;
            discover)    ARGS="--discover" ;;
            full)        ARGS="--discover --all --linkedin" ;;
            *)           ARGS="" ;;  # missing = default
          esac

          [ -n "$COUNTRY" ] && ARGS="$ARGS --country $COUNTRY"

          python crawler.py $ARGS --csv prospects.csv

      - name: Inject data into HTML
        run: |
          python - << 'PYEOF'
          import csv, json, re, datetime

          with open('prospects.csv', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))

          data_js = "window.PROSPECT_DATA = " + json.dumps(rows, ensure_ascii=False) + ";"

          with open('index.html', encoding='utf-8') as f:
              html = f.read()

          html = re.sub(
              r'/\* PROSPECT_DATA_START \*/.*?/\* PROSPECT_DATA_END \*/',
              f"/* PROSPECT_DATA_START */\n{data_js}\n/* PROSPECT_DATA_END */",
              html, flags=re.DOTALL
          )

          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(html)

          has_li = sum(1 for r in rows if r.get('linkedin','').strip())
          print(f"Injected {len(rows)} rows | {has_li} with LinkedIn")
          PYEOF

      - name: Commit results
        run: |
          git config user.name  "ABM Auto-updater"
          git config user.email "bot@abrilliantmind.blog"
          git add prospects.csv crawl_status.json index.html
          git diff --staged --quiet || git commit -m \
            "auto-update: prospects $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
